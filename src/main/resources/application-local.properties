
# 1. 로컬 MySQL 접속 정보
spring.datasource.url=jdbc:mysql://localhost:3306/monitor_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# 종희님 로컬 MySQL 비밀번호를 적어주세요! (예: 1234)
spring.datasource.password=a!8923004

# 2. JPA (Hibernate) 설정
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 서버 켤 때마다 테이블을 새로 만들고 싶으면 create, 유지하고 싶으면 update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. 로컬 테스트용 가짜 변수들 (AWS 오류 방지용 - 이 부분은 그대로 둡니다!)
aws.alb.dns.name=local.monitoring.com
aws.ami.id=ami-local
aws.vpc.id=vpc-local
aws.subnet.private.id=subnet-local
aws.sg.monitoring.id=sg-local
aws.alb.listener.arn=arn-local