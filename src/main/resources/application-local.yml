spring:
  datasource:
    url: jdbc:mysql://localhost:3306/monitor_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:a!8923004}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

aws:
  vpc:
    id: vpc-local
  ami:
    id: ami-local
  subnet:
    private:
      id: subnet-local
  sg:
    monitoring:
      id: sg-local
  alb:
    dns:
      name: localhost:9090
    listener:
      arn: arn-local

monitoring:
  backend-url: http://localhost:8080

jwt:
  secret: local-dev-secret-key-minimum-32-characters-long
  expiration-ms: 86400000

openai:
  api:
    key: sk-dummy-local
    url: https://api.openai.com/v1/chat/completions

langchain4j:
  open-ai:
    chat-model:
      api-key: sk-dummy-local
      model-name: gpt-3.5-turbo
      temperature: 0.7

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: dummy@gmail.com
    password: dummy-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
