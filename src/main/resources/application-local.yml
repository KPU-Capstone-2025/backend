spring:
  datasource:
    url: jdbc:mysql://localhost:3306/monitor_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:a!8923004}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

aws:
  vpc:
    id: vpc-local
  ami:
    id: ami-local
  subnet:
    private:
      id: subnet-local
  sg:
    monitoring:
      id: sg-local
  alb:
    dns:
      name: localhost:9090
    listener:
      arn: arn-local

monitoring:
  backend-url: http://localhost:8080
